name: Generate Hero and Projects SVGs

on:
  # Daily refresh of project stars, last-updated times and language splits
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  # Rebuild immediately when the generators or the portrait change
  push:
    branches:
      - main
    paths:
      - "generate_banner.py"
      - "generate_projects.py"
      - "profile-source.png"
      - ".github/workflows/generate-svgs.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate hero banner
        run: python generate_banner.py

      - name: Generate projects list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_projects.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg projects-dark.svg projects-light.svg
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Regenerate hero and projects SVGs"
          git pull --rebase
          git push
