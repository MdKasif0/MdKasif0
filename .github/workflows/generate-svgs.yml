name: Generate Portfolio README Images

on:
  # Daily refresh of the GitHub contribution graph, streaks, repos and stars
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  # Rebuild immediately when the generator or its fonts and images change
  push:
    branches:
      - main
    paths:
      - "generate_portfolio.py"
      - "assets/src/**"
      - ".github/workflows/generate-svgs.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install fonttools brotli Pillow

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_portfolio.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Regenerate portfolio README images"
          git pull --rebase
          git push
