name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # brand palette: red snake eating red-scale contributions
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F2503E&color_dots=#15151c,#5c1a18,#982320,#d92b26,#ff6a5b&color_background=#05050A
            dist/snake-light.svg?palette=github&color_snake=#E3211C&color_dots=#e3e0da,#e0acaa,#e9786f,#e3211c,#ff5443&color_background=#EEEBE5

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
